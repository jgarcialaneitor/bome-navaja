[project]
name = "bome-navaja"
version = "0.0.2"
description = "MCP server for the Boletín Oficial de la Ciudad Autónoma de Melilla (BOME)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "mcp>=2,<3",
    "pypdf>=5.0",
]

[project.scripts]
bome-navaja-mcp = "bome_navaja.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bome_navaja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real bomemelilla.es site (skipped unless BOME_NAVAJA_LIVE=1)",
]
